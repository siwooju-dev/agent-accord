[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealbattle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.4", "SQLAlchemy==2.0.40", "alembic==1.15.2", "httpx==0.28.1", "uvicorn==0.34.2", "PyYAML==6.0.2", "web3==7.11.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "eth-tester==0.13.0b1", "py-evm==0.12.1b1"]
postgres = ["psycopg[binary]==3.2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
