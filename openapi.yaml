components:
  schemas:
    AgreementView:
      properties:
        id:
          type: string
          title: Id
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        snapshot_hash:
          type: string
          title: Snapshot Hash
        valid:
          type: boolean
          title: Valid
        approval:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Approval
      additionalProperties: false
      type: object
      required:
      - id
      - snapshot
      - snapshot_hash
      - valid
      - approval
      title: AgreementView
    ApprovalInput:
      properties:
        expected_policy_version:
          type: integer
          minimum: 0.0
          title: Expected Policy Version
        snapshot_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Snapshot Hash
      additionalProperties: false
      type: object
      required:
      - expected_policy_version
      - snapshot_hash
      title: ApprovalInput
    BuyerPolicy:
      properties:
        max_total_krw:
          type: integer
          maximum: 100000000.0
          exclusiveMinimum: 0.0
          title: Max Total Krw
        min_ram_gb:
          type: integer
          maximum: 256.0
          minimum: 1.0
          title: Min Ram Gb
        min_ssd_gb:
          type: integer
          maximum: 8192.0
          minimum: 1.0
          title: Min Ssd Gb
        allowed_seller_ids:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Allowed Seller Ids
        delivery_by:
          type: string
          format: date
          title: Delivery By
        expires_at:
          type: string
          format: date-time
          title: Expires At
        max_rounds:
          type: integer
          maximum: 12.0
          minimum: 2.0
          title: Max Rounds
          default: 6
      additionalProperties: false
      type: object
      required:
      - max_total_krw
      - min_ram_gb
      - min_ssd_gb
      - allowed_seller_ids
      - delivery_by
      - expires_at
      title: BuyerPolicy
    ChainView:
      properties:
        record_id:
          type: string
          title: Record Id
        adapter_mode:
          type: string
          enum:
          - mock
          - evm
          title: Adapter Mode
        status:
          type: string
          enum:
          - QUEUED
          - SUBMITTING
          - PENDING
          - CONFIRMED
          - MOCK_RECORDED
          - UNKNOWN
          - FAILED
          title: Status
        audit_hash:
          type: string
          title: Audit Hash
        chain_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chain Id
        contract:
          anyOf:
          - type: string
          - type: 'null'
          title: Contract
        tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Tx Hash
        nonce:
          anyOf:
          - type: integer
          - type: 'null'
          title: Nonce
        explorer_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Explorer Url
        receipt:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Receipt
        event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Event
      additionalProperties: false
      type: object
      required:
      - record_id
      - adapter_mode
      - status
      - audit_hash
      - chain_id
      - contract
      - tx_hash
      - nonce
      - explorer_url
      - receipt
      - event
      title: ChainView
    ChangePolicy:
      properties:
        expected_policy_version:
          type: integer
          minimum: 0.0
          title: Expected Policy Version
        policy:
          $ref: '#/components/schemas/BuyerPolicy'
      additionalProperties: false
      type: object
      required:
      - expected_policy_version
      - policy
      title: ChangePolicy
    Check:
      properties:
        rule:
          type: string
          title: Rule
        passed:
          type: boolean
          title: Passed
        reason_code:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - rule
      - passed
      - reason_code
      title: Check
