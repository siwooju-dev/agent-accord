          maxLength: 200
          minLength: 1
          title: Name
        ram_gb:
          type: integer
          maximum: 256.0
          minimum: 1.0
          title: Ram Gb
        ssd_gb:
          type: integer
          maximum: 8192.0
          minimum: 1.0
          title: Ssd Gb
        asking_price_krw:
          type: integer
          maximum: 100000000.0
          exclusiveMinimum: 0.0
          title: Asking Price Krw
        shipping_fee_krw:
